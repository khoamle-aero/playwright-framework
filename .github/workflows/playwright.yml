name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ui-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://saucedemo.com
    # Grants write access to allow GitHub Actions to commit updated snapshots
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      # Only installs Chromium and Firefox since WebKit is not in your config
      run: npx playwright install --with-deps chromium firefox
    - name: Run UI tests
      # Appended --update-snapshots to automatically write missing or updated baselines
      run: npx playwright test --project=parabank-chromium --project=parabank-firefox --project=saucedemo-chromium --project=restful-booker-hybrid-chromium --update-snapshots
    
    - name: Commit and Push Updated Snapshots
      if: ${{ !cancelled() }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Check if there are any new or modified snapshot images
        if [ -n "$(git status --porcelain | grep '\.png')" ]; then
          echo "New snapshots detected. Committing changes..."
          git add src/tests/**/*.png
          git commit -m "chore: auto-update Playwright visual regression snapshots [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
        else
          echo "No snapshot variations found."
        fi
        
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: reports/html/
        retention-days: 30

  api-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      RESTFUL_BOOKER_URL: https://herokuapp.com
      BASE_URL: https://saucedemo.com
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright OS Dependencies
      # Installs framework dependencies needed by the test runner without downloading browser packages
      run: npx playwright install-deps
    - name: Run API tests
      run: npx playwright test --project=restful-booker-api
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: api-report
        path: reports/html/
        retention-days: 30

  postman-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run Postman collection via Newman
      run: npm run test:postman
